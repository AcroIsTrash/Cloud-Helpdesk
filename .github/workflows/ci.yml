name: CI

on:
  push:
  pull_request:

# Checks only read the code; the token gets nothing more.
permissions:
  contents: read

# The job names below are what branch protection requires; keep them stable.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version, so CI runs the same Python as everywhere else.
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: mypy
        run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: pytest
        run: uv run pytest

  # The declared tables (app/db.py) and the migrations must describe the same
  # schema: upgrade an empty database to head, then autogenerate must find
  # nothing left to do. Fails when a table changes without a migration.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://helpdesk:helpdesk@localhost:5432/helpdesk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Upgrade an empty database to head
        run: uv run alembic upgrade head
      - name: Autogenerate finds no differences
        run: uv run alembic check

  # On a clean machine, `docker compose up` must end with the app serving the
  # seeded demo data, from an image holding only the app (scripts/check-image.sh).
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: The image holds only the app and runs as non-root
        run: scripts/check-image.sh cloud-helpdesk:local
      - name: docker compose up
        run: docker compose up --detach --wait
      - name: The app serves seeded demo data after login
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS -c cookies -o /dev/null -d user_id=1 http://localhost:8000/login
          curl -fsS -b cookies http://localhost:8000/api/tickets \
            | python3 -c 'import json, sys; n = len(json.load(sys.stdin)); print(n, "tickets"); assert n > 0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
