name: CI

on:
  push:
  pull_request:

# The job names below are what branch protection requires; keep them stable.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv reads .python-version, so CI runs the same Python as everywhere else.
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: mypy
        run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: pytest
        run: uv run pytest
